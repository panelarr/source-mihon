syntax = "proto3";

package panelarr.mihon.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "panelarr.mihon.v1";

// MihonAdminService manages installed Mihon extensions. Needs the `admin` scope.
service MihonAdminService {
  // ListExtensions lists installed extensions, including ones that failed to load.
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse) {
    option (google.api.http) = {get: "/v1/admin/extensions"};
  }

  // GetExtension returns one installed extension.
  rpc GetExtension(GetExtensionRequest) returns (GetExtensionResponse) {
    option (google.api.http) = {get: "/v1/admin/extensions/{pkg_name}"};
  }

  // InstallExtension installs (or replaces) an extension from a URL or from uploaded
  // bytes. A jar is used as is; an APK is converted to a jar first. When an expected
  // SHA-256 or signing fingerprint is given and doesn't match, nothing is installed.
  rpc InstallExtension(InstallExtensionRequest) returns (InstallExtensionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/extensions"
      body: "*"
    };
  }

  // UninstallExtension removes an extension, its sources and its files. Source
  // settings and cookies are kept unless `delete_data` is set.
  rpc UninstallExtension(UninstallExtensionRequest) returns (UninstallExtensionResponse) {
    option (google.api.http) = {delete: "/v1/admin/extensions/{pkg_name}"};
  }

  // CheckSources runs checks against sources now: by default the first page of popular,
  // or the steps asked for, each feeding the next (a series from the list, a chapter of
  // the series, a page of the chapter). It records the result as each source's health.
  rpc CheckSources(CheckSourcesRequest) returns (CheckSourcesResponse) {
    option (google.api.http) = {
      post: "/v1/admin/checks"
      body: "*"
    };
  }

  // SetHealthCheck turns scheduled health checks on or off for one source. They're on for
  // every source by default, when the service runs them at all.
  rpc SetHealthCheck(SetHealthCheckRequest) returns (SetHealthCheckResponse) {
    option (google.api.http) = {
      put: "/v1/admin/sources/{source_id}/health-check"
      body: "*"
    };
  }

  // GetHealthCheckSchedule returns when the `source-health` job checks sources on its
  // own, and which.
  rpc GetHealthCheckSchedule(GetHealthCheckScheduleRequest) returns (GetHealthCheckScheduleResponse) {
    option (google.api.http) = {get: "/v1/admin/health-checks/schedule"};
  }

  // SetHealthCheckSchedule replaces the health-check schedule, overriding the
  // MIHON_HEALTH_CHECK_* environment variables until it is reset; the job's next run
  // follows the new interval at once. Leaving `schedule` unset goes back to the
  // environment's schedule.
  rpc SetHealthCheckSchedule(SetHealthCheckScheduleRequest) returns (SetHealthCheckScheduleResponse) {
    option (google.api.http) = {
      put: "/v1/admin/health-checks/schedule"
      body: "*"
    };
  }

  // SetExtensionLanguages sets which of an extension's languages it offers sources in.
  // Its sources in other languages aren't listed, and calls to them answer NOT_FOUND.
  // The setting survives updates. Languages must be among the extension's sources'
  // languages; none means all of them. "all" and "multi" are languages like any other:
  // list them to keep multi-language sources.
  rpc SetExtensionLanguages(SetExtensionLanguagesRequest) returns (SetExtensionLanguagesResponse) {
    option (google.api.http) = {
      put: "/v1/admin/extensions/{pkg_name}/languages"
      body: "*"
    };
  }

  // ReloadExtension unloads an extension and loads it again from its installed file.
  rpc ReloadExtension(ReloadExtensionRequest) returns (ReloadExtensionResponse) {
    option (google.api.http) = {
      post: "/v1/admin/extensions/{pkg_name}/reload"
      body: "*"
    };
  }
}

message Extension {
  // Package name, the extension's unique identifier.
  string pkg_name = 1;
  string name = 2;
  string version_name = 3;
  int64 version_code = 4;
  // extensions-lib version the extension was built against, e.g. "1.4".
  string lib_version = 5;
  ExtensionFormat format = 6;
  ContentWarning content_warning = 7;
  ExtensionStatus status = 8;
  // Why the extension failed to load. Empty when it loaded.
  string load_error = 9;
  // Sources the extension provides. Empty when it failed to load.
  repeated ExtensionSource sources = 10;
  // SHA-256 (hex, lowercase) of the signing certificate. Empty when unsigned.
  string signing_fingerprint = 11;
  // SHA-256 (hex, lowercase) of the file as downloaded or uploaded.
  string sha256 = 12;
  // Where the extension came from.
  ExtensionOrigin origin = 13;
  google.protobuf.Timestamp installed_at = 14;
  // Languages the extension offers sources in (SetExtensionLanguages). Empty means all.
  repeated string enabled_langs = 15;
}

enum ExtensionFormat {
  EXTENSION_FORMAT_UNSPECIFIED = 0;
  EXTENSION_FORMAT_JAR = 1;
  // Converted from an APK at install time.
  EXTENSION_FORMAT_APK = 2;
}

enum ContentWarning {
  CONTENT_WARNING_UNSPECIFIED = 0;
  CONTENT_WARNING_SAFE = 1;
  CONTENT_WARNING_MIXED = 2;
  CONTENT_WARNING_NSFW = 3;
}

enum ExtensionStatus {
  EXTENSION_STATUS_UNSPECIFIED = 0;
  EXTENSION_STATUS_LOADED = 1;
  // Installed, but loading failed. See load_error.
  EXTENSION_STATUS_ERROR = 2;
}

message ExtensionSource {
  string id = 1;
  string name = 2;
  string lang = 3;
  // Its language is enabled, so the source is listed.
  bool available = 4;
}

message ExtensionOrigin {
  oneof kind {
    // Installed from this URL.
    string url = 1;
    // Installed from uploaded bytes; the original file name.
    string upload = 2;
    // Installed from an extension store.
    string store_id = 3;
  }
}

message ListExtensionsRequest {}

message ListExtensionsResponse {
  repeated Extension extensions = 1;
}

message GetExtensionRequest {
  string pkg_name = 1;
}

message GetExtensionResponse {
  Extension extension = 1;
}

message InstallExtensionRequest {
  oneof file {
    // http(s) URL of a .jar or .apk.
    string url = 1;
    // The file itself. Over HTTP/JSON this is base64; large files can also be sent to
    // the multipart upload endpoint described in the service docs.
    bytes data = 2;
  }
  // Original file name of uploaded data. Used to tell a jar from an APK and shown in
  // the extension's origin.
  string file_name = 3;
  // When set, the file's SHA-256 (hex) must match.
  string expected_sha256 = 4;
  // When set, the signing certificate's SHA-256 (hex) must match.
  string expected_signing_fingerprint = 5;
}

message InstallExtensionResponse {
  Extension extension = 1;
}

message UninstallExtensionRequest {
  string pkg_name = 1;
  // Also delete the settings and cookies of the extension's sources.
  bool delete_data = 2;
}

message UninstallExtensionResponse {}

enum CheckStep {
  CHECK_STEP_UNSPECIFIED = 0;
  CHECK_STEP_POPULAR = 1;
  CHECK_STEP_LATEST = 2;
  // Searches with search_query, or with the title of the first popular series.
  CHECK_STEP_SEARCH = 3;
  CHECK_STEP_DETAILS = 4;
  CHECK_STEP_CHAPTERS = 5;
  CHECK_STEP_PAGES = 6;
  // Downloads the first page's image (only its first bytes).
  CHECK_STEP_IMAGE = 7;
}

message CheckSourcesRequest {
  // Sources to check. Empty means every loaded source.
  repeated string source_ids = 1;
  // Steps to run. Empty means CHECK_STEP_POPULAR only.
  repeated CheckStep steps = 2;
  string search_query = 3;
  // Sources checked at the same time. 0 means 4.
  uint32 concurrency = 4;
}

message CheckSourcesResponse {
  repeated SourceCheck results = 1;
}

message SourceCheck {
  string source_id = 1;
  string source_name = 2;
  string lang = 3;
  string pkg_name = 4;
  bool ok = 5;
  repeated StepResult steps = 6;
  google.protobuf.Timestamp checked_at = 7;
}

message StepResult {
  CheckStep step = 1;
  bool ok = 2;
  // Not run: an earlier step it needs failed or found nothing, or the source can't do it.
  bool skipped = 3;
  // Error reason (e.g. "SOURCE_DOWN") or gRPC code name when it failed.
  string reason = 4;
  string message = 5;
  google.protobuf.Duration duration = 6;
  // What the step found, e.g. "20 series" or "image/webp, 350 KB".
  string detail = 7;
}

// When the `source-health` job checks sources on its own, and which.
message HealthCheckSchedule {
  // How often. Unset means no scheduled checks; at least a minute otherwise.
  google.protobuf.Duration interval = 1;
  // Source languages the checks cover. Empty means all.
  repeated string langs = 2;
  // Sources per round, the least recently checked first. 0 means all.
  uint32 sample = 3;
  // Where the schedule comes from: "SetHealthCheckSchedule" once set over the API, or
  // the environment variables. Ignored in SetHealthCheckSchedule.
  string source = 4;
}

message GetHealthCheckScheduleRequest {}

message GetHealthCheckScheduleResponse {
  HealthCheckSchedule schedule = 1;
}

message SetHealthCheckScheduleRequest {
  // The new schedule; unset goes back to the environment's.
  HealthCheckSchedule schedule = 1;
}

message SetHealthCheckScheduleResponse {
  HealthCheckSchedule schedule = 1;
}

message SetHealthCheckRequest {
  string source_id = 1;
  bool enabled = 2;
}

message SetHealthCheckResponse {}

message ReloadExtensionRequest {
  string pkg_name = 1;
}

message ReloadExtensionResponse {
  Extension extension = 1;
}

message SetExtensionLanguagesRequest {
  string pkg_name = 1;
  // Languages to offer sources in; empty means all.
  repeated string enabled_langs = 2;
}

message SetExtensionLanguagesResponse {
  Extension extension = 1;
}
