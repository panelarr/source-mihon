name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    # Code scanning needs GitHub Advanced Security on private repositories.
    # Skip the job while the repository is private; it runs once it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: source-mihon

      - uses: actions/checkout@v5
        with:
          repository: panelarr/source-api
          ref: main
          path: source-api

      - uses: actions/setup-go@v6
        with:
          go-version-file: source-mihon/go.mod
          cache-dependency-path: source-mihon/go.sum

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
          source-root: source-mihon

      - name: Build
        working-directory: source-mihon
        run: go build ./...

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
