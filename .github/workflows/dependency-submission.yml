name: Dependency submission

# GitHub's dependency graph doesn't resolve Go modules on its own. This resolves the
# module graph of every package on main and submits it, so the plugin's Go libraries
# show up in the dependency graph and get Dependabot alerts. It can also be run by hand
# to refresh the graph.

on:
  push:
    branches: [main, ci/source-mihon-go-dependency-submission]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Submit Go dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Writing to the dependency graph API needs contents: write.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: source-mihon

      # Until source-api publishes tagged versions, go.mod points at a sibling
      # checkout with a replace directive (the same layout as ci.yml).
      - uses: actions/checkout@v5
        with:
          repository: panelarr/source-api
          ref: main
          path: source-api

      - uses: actions/setup-go@v6
        with:
          go-version-file: source-mihon/go.mod
          cache-dependency-path: source-mihon/go.sum

      - uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: source-mihon/go.mod
          go-build-target: ./...
