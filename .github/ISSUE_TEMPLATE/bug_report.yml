name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security issues go through private reporting (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, API calls or config that trigger it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove API keys, tokens and credentials first.
      render: text
